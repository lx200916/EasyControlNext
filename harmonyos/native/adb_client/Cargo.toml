[package]
name = "easycontrol-adb-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "ADB TCP session / stream multiplexer for the HarmonyOS controller (host-testable)"
publish = false

[dependencies]
easycontrol-protocol = { workspace = true }
sha2 = { workspace = true }
sha1 = { workspace = true }
rsa = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
num-bigint-dig = { workspace = true }
num-traits = { workspace = true }
curve25519-dalek = { workspace = true }
zeroize = { workspace = true }
hkdf = { workspace = true }
aes-gcm = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
rcgen = { workspace = true }

[[bin]]
name = "gate_c"
path = "src/bin/gate_c.rs"

[[bin]]
name = "gate_d"
path = "src/bin/gate_d.rs"

[dev-dependencies]

plugins {
  id 'com.android.application'
  id 'org.jetbrains.kotlin.android'
  id 'org.jetbrains.kotlin.plugin.compose'
}

def keystorePropertiesFile = rootProject.file('../keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
  keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
  namespace = 'com.shiyunjin.easycontrolnext.app'
  compileSdk = 36

  defaultConfig {
    applicationId "com.shiyunjin.easycontrolnext.app"
    // material3 LoadingIndicator (M3 Expressive) requires minSdk 23+
    minSdk 23
    targetSdk 34
    versionCode 10014
    versionName '1.3.0'
    ndk {
      abiFilters "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
    }
  }

  buildFeatures {
    compose = true
    buildConfig = true
    viewBinding = true
  }

  signingConfigs {
      release {
        if (keystorePropertiesFile.exists()) {
          storeFile file(keystoreProperties['MY_KEYSTORE_FILE'])
          storePassword keystoreProperties['MY_KEYSTORE_PASSWORD']
          keyAlias keystoreProperties['MY_KEY_ALIAS']
          keyPassword keystoreProperties['MY_KEY_PASSWORD']
        } else {
          println "Keystore properties file not found. No signing configuration will be applied."
        }
      }
  }

  buildTypes {
    debug {
      buildConfigField "boolean", "ENABLE_DEBUG_FEATURE", "true"
      manifestPlaceholders = [app_name: "@string/app_name_dev", app_icon: "@mipmap/ic_launcher_dev", app_icon_round: "@mipmap/ic_launcher_dev_round"]
      debuggable true
    }
    release {
      buildConfigField "boolean", "ENABLE_DEBUG_FEATURE", "false"
      manifestPlaceholders = [app_name: "@string/app_name", app_icon: "@mipmap/ic_launcher", app_icon_round: "@mipmap/ic_launcher_round"]
      debuggable false
      minifyEnabled false
      shrinkResources = false
      proguardFiles 'proguard-rules.pro'
      if (keystorePropertiesFile.exists()) {
        signingConfig = signingConfigs.release
      } else {
        println "Keystore properties file not found. No signing configuration will be applied."
      }
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }

  dependenciesInfo {
    // Disables dependency metadata when building APKs.
    includeInApk = false
    // Disables dependency metadata when building Android App Bundles.
    includeInBundle = false
  }

  packagingOptions {
    resources.excludes.add("META-INF/*")
    // Unable to strip the following libraries, packaging them as they are:
    jniLibs.keepDebugSymbols.add("**/libconscrypt_jni.so")
    jniLibs.keepDebugSymbols.add("**/libspake2.so")
  }

}

dependencies {
  // Stable BOM for Compose core; pin material3 alpha for LoadingIndicator (M3 Expressive).
  // alpha18 includes LoadingIndicator/ContainedLoadingIndicator and still supports AGP 8.x / compileSdk 36.
  def composeBom = platform('androidx.compose:compose-bom:2025.05.01')
  implementation composeBom
  implementation 'androidx.compose.ui:ui'
  implementation 'androidx.compose.ui:ui-tooling-preview'
  implementation 'androidx.compose.material3:material3:1.5.0-alpha18'
  implementation 'androidx.compose.material:material-icons-extended'
  debugImplementation 'androidx.compose.ui:ui-tooling'

  implementation 'androidx.activity:activity-compose:1.9.3'
  implementation 'androidx.navigation:navigation-compose:2.8.3'
  implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
  implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
  implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

  // Window-size / foldable adaptive layouts (list-detail, size class)
  implementation 'androidx.compose.material3.adaptive:adaptive:1.2.0'
  implementation 'androidx.compose.material3.adaptive:adaptive-layout:1.2.0'
  implementation 'androidx.compose.material3.adaptive:adaptive-navigation:1.2.0'
  implementation 'androidx.compose.material3:material3-window-size-class'

  implementation 'androidx.documentfile:documentfile:1.1.0'
  implementation 'org.conscrypt:conscrypt-android:2.5.3'
  implementation 'com.github.MuntashirAkon:sun-security-android:1.1'

  implementation "androidx.annotation:annotation:1.9.1"
  implementation 'org.bouncycastle:bcprov-jdk15to18:1.82'
  implementation 'com.github.shiyunjin.spake2-java:spake2-android:2.2.0'
  implementation 'com.google.zxing:core:3.5.3'
}


// server:copy* writes into app/src/main/res/raw; every app task that reads res must depend on it.
afterEvaluate {
  def debugResTasks = tasks.matching { task ->
    def n = task.name
    n.contains("Debug") && (
      n.contains("Resource") ||
      n.contains("Assets") ||
      n.contains("Manifest") ||
      n.startsWith("mapDebug") ||
      n.startsWith("mergeDebug") ||
      n.startsWith("packageDebug") ||
      n.startsWith("parseDebug") ||
      n.startsWith("processDebug") ||
      n.startsWith("generateDebug") ||
      n.startsWith("dataBinding") ||
      n == "preDebugBuild" ||
      n == "preBuild"
    )
  }
  debugResTasks.configureEach { dependsOn(":server:copyDebug") }

  def releaseResTasks = tasks.matching { task ->
    def n = task.name
    n.contains("Release") && (
      n.contains("Resource") ||
      n.contains("Assets") ||
      n.contains("Manifest") ||
      n.startsWith("mapRelease") ||
      n.startsWith("mergeRelease") ||
      n.startsWith("packageRelease") ||
      n.startsWith("parseRelease") ||
      n.startsWith("processRelease") ||
      n.startsWith("generateRelease") ||
      n == "preReleaseBuild"
    )
  }
  releaseResTasks.configureEach { dependsOn(":server:copyRelease") }
}
